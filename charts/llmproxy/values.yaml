# Default values for llmproxy.
# This is a YAML-formatted file.

# Budget accounting and per-session injection-trajectory scoring are held in
# process memory, and the daily spend total is persisted by OVERWRITING a single
# key rather than incrementing it. With more than one replica each pod therefore
# enforces the full daily_limit against its own float and overwrites the other's
# total, so the fleet can spend a multiple of the configured budget, and a
# session split across pods is scored by each pod independently — weakening the
# multi-turn injection detector. Keep this at 1 until that state is shared
# (see core/rate_limiter.py for the Redis-backed pattern already used here).
replicaCount: 1

# data/ is the only state that cannot be reconstructed: the endpoint registry,
# app_state (including the persisted daily budget), the spend ledger, the RBAC
# subjects, the tamper-evident audit chain and the PBKDF2 salt that decrypts
# every stored credential. With no volume it lives in the pod's ephemeral
# filesystem and is lost on every restart, rescheduling or `helm upgrade` —
# which is what happened in production before the store was moved under data/,
# and what this chart still did afterwards because it never received a volume.
#
# An audit chain that restarts empty on every deploy evidences nothing, so this
# defaults to enabled. Set persistence.enabled=false only for a throwaway
# evaluation where losing the database on restart is acceptable.
persistence:
  enabled: true
  # ReadWriteOnce is correct here: replicaCount is pinned to 1 for the reasons
  # given above, so there is never a second pod contending for this claim.
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  # "" uses the cluster default StorageClass; "-" disables dynamic provisioning.
  storageClass: ""
  # Bind an existing claim instead of creating one (e.g. a restored snapshot).
  existingClaim: ""
  annotations: {}

image:
  repository: ghcr.io/fabriziosalmi/llmproxy
  pullPolicy: IfNotPresent
  # Empty means "follow the chart's appVersion", which the deployment template
  # already does via `.Values.image.tag | default .Chart.AppVersion`. It is left
  # empty on purpose: a pinned literal here silently outlived eleven releases —
  # the chart declared 1.33.0 while still deploying the 1.21.81 image, including
  # the database-loss defect that release fixed. Set it only to pin a specific
  # image deliberately, and remember it will not follow future chart bumps.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 999

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999

service:
  type: ClusterIP
  port: 8090
  metricsPort: 9091
  adminPort: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: llmproxy.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 512Mi

autoscaling:
  # Autoscaling multiplies the per-process state problem described at
  # replicaCount above: every added pod enforces the full daily budget against
  # its own in-memory total. Do not enable until that state is shared.
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Redis dependency configuration (bundled or external)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

# Secrets and Env Configs
env: {}
  # DB_TYPE: postgres
  # DATABASE_URL: "postgresql://user:pass@host:5432/db"

secrets:
  # Existing secret name to load environment variables (e.g. API keys) from
  existingSecret: ""
  # Or provide them inline (will be created as a new Kubernetes Secret)
  inline: {}
    # OPENAI_API_KEY: ""
    # ANTHROPIC_API_KEY: ""
    # LLM_PROXY_API_KEYS: ""

# config.yaml content to be injected via ConfigMap
config: |
  server:
    host: 0.0.0.0
    port: 8090
    timeout: 30s
    keep_alive: 60s
    tls:
      enabled: false
    auth:
      enabled: false
      api_keys_env: "LLM_PROXY_API_KEYS"
    metrics:
      enabled: true
      port: 9091
    admin:
      enabled: true
      port: 8081
    storage:
      type: "sqlite"
  security:
    enabled: true
    max_payload_size_kb: 512
    max_messages: 50
    link_sanitization:
      enabled: true
  rotation:
    strategy: "round_robin"
    failover:
      enabled: true
      max_retries: 3
      retry_delay: 1s
      switch_on_status: [429, 500, 503]

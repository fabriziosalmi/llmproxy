apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmproxy.fullname" . }}
  labels:
    {{- include "llmproxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Recreate, not the RollingUpdate default: the pod holds a single SQLite writer
  # on a ReadWriteOnce volume. A rolling update starts the new pod while the old
  # one still runs, so on one node two processes write the same database file and
  # on several the new pod waits forever on a Multi-Attach error.
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "llmproxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # config.yaml reaches the pod through a subPath mount, which Kubernetes
        # never refreshes in place; without this a config-only `helm upgrade`
        # neither restarted the pod nor changed the file it reads.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "llmproxy.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "llmproxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          # /health answers 200 whatever its verdict (it reports "down" in the
          # body), so a probe on it can never fail for anything but a hung
          # process. That is right for liveness: a failing store is not cured by
          # a restart. Readiness uses /ready, which is 503 when the verdict is
          # "down", so a pod that cannot serve is taken out of the Service.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            {{- if .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
            {{- else if .Values.secrets.inline }}
            - secretRef:
                name: {{ include "llmproxy.fullname" . }}-secrets
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.persistence.enabled }}
            # data/ holds the endpoint registry, app_state (including the
            # persisted daily budget), the spend ledger, the RBAC subjects, the
            # tamper-evident audit chain and the encryption salt. Without this
            # mount all of it lives in the pod's ephemeral filesystem and is
            # destroyed on every restart, rescheduling or helm upgrade — the
            # same loss that hit production before the store was moved under
            # data/, reproduced here because the chart never got a volume.
            - name: data
              mountPath: /app/data
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "llmproxy.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "llmproxy.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

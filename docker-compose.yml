# Requires Docker Compose v2 (`docker compose`, the plugin).
# Legacy `docker-compose` v1 is NOT supported — it breaks with modern
# urllib3 (HTTPConnection.request() got an unexpected keyword argument 'chunked').
# Install the plugin: sudo apt install docker-compose-plugin (Debian/Ubuntu)
# or see https://docs.docker.com/compose/install/linux/
services:
  llmproxy:
    build: .
    container_name: llmproxy
    restart: unless-stopped
    ports:
      - "8090:8090"   # Proxy API
      # Metrics exporter lives outside the ASGI app: no auth, no rate-limit,
      # no firewall, no security headers. Bind loopback; scrape via RP or
      # use GET /metrics:8090 (admin-auth) instead of widening this.
      - "127.0.0.1:9091:9091"   # Prometheus metrics (loopback only)
    volumes:
      - llmproxy-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./plugins:/app/plugins/bundled:ro
      - llmproxy-plugins:/app/plugins/installed
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      # LLM_PROXY_SALT_PATH is deliberately NOT pinned here. The encryption salt
      # now defaults to /app/data/.llmproxy_salt — inside the volume below,
      # alongside the ciphertext it decrypts — and when an older stack still has
      # one at /app/.llmproxy_salt the code keeps using it and logs where to move
      # it. Setting the variable here would skip that fallback and generate a
      # fresh salt on upgrade, orphaning every stored credential.
    depends_on:
      - redis
    # Make the Docker host reachable as `host.docker.internal` from inside the
    # container on Linux (macOS/Windows Desktop already provide this alias).
    # Needed for auto-discovery of locally-running Ollama/LM Studio/vLLM.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Verdict-aware like Dockerfile HEALTHCHECK: /health returns 200 even
      # when status is down/degraded, so urlopen() alone can never fail.
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; sys.exit(1) if json.load(urllib.request.urlopen('http://localhost:8090/health', timeout=4)).get('status') == 'down' else sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:8-alpine
    container_name: llmproxy-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    # Example with auth: set REDIS_PASSWORD in .env, then use
    # command: ["redis-server", "--appendonly", "yes", "--requirepass", "$${REDIS_PASSWORD}"]
    # and REDIS_URL=redis://:$$REDIS_PASSWORD@redis:6379/0 on llmproxy.
    # Default stays without password for local dev; prod must set it —
    # rate-limit/circuit state is mutable by anyone on this network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  llmproxy-data:
    driver: local
  llmproxy-plugins:
    driver: local
  redis-data:
    driver: local

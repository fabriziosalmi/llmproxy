name: CI

on:
  push:
    branches: [main]
    # Tags run the full suite too. Previously nothing gated a tag push at all:
    # branch protection does not apply to tags, and the image workflow fired
    # on them independently.
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-hardening:
    name: Workflow Hardening Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Enforce SHA-pinned GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import glob, json, os, re, sys, urllib.error, urllib.request

          # The old pattern was `^\s*-\s*uses:` — it only matched a `uses:` that
          # opens a step. A `uses:` written under a `- name:` line has no dash of
          # its own, so 14 of the 49 action references in this repository were
          # invisible to the gate that reported "All workflow actions are
          # SHA-pinned", including the one in deploy.yml that was pinned to a SHA
          # that does not exist.
          pat = re.compile(r'^\s*(?:-\s*)?uses:\s*([^\s#]+)')

          bad, refs = [], {}
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              for i, line in enumerate(open(path, encoding='utf-8'), 1):
                  m = pat.search(line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith('./') or ref.startswith('docker://'):
                      continue
                  if '@' not in ref:
                      bad.append((path, i, ref, 'missing @ref'))
                      continue
                  name, tag = ref.rsplit('@', 1)
                  if not re.fullmatch(r'[0-9a-f]{40}', tag):
                      bad.append((path, i, ref, 'not SHA-pinned'))
                      continue
                  refs.setdefault((name, tag), []).append((path, i))

          # A 40-hex string is not proof that the commit exists. deploy.yml
          # carried a well-formed, entirely fictional SHA for ten releases: the
          # workflow only runs on `release: published`, so the "unable to resolve
          # action" error surfaced solely at release time, where nobody read it.
          # Resolving each pin here catches that on the PR that introduces it.
          # Network and rate-limit failures warn rather than fail — the gate must
          # stay deterministic — but a definitive 404/422 is an error.
          token = os.environ.get('GH_TOKEN', '')
          checked = unverified = 0
          for (name, sha), where in sorted(refs.items()):
              owner_repo = '/'.join(name.split('/')[:2])
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{owner_repo}/commits/{sha}',
                  headers={'Accept': 'application/vnd.github+json',
                           'User-Agent': 'llmproxy-workflow-hardening',
                           **({'Authorization': f'Bearer {token}'} if token else {})},
                  method='HEAD')
              try:
                  urllib.request.urlopen(req, timeout=15)
                  checked += 1
              except urllib.error.HTTPError as e:
                  if e.code in (404, 422):
                      for p, i in where:
                          bad.append((p, i, f'{name}@{sha}',
                                      f'SHA does not exist in {owner_repo} (HTTP {e.code})'))
                  else:
                      unverified += 1
                      print(f'::warning::could not verify {name}@{sha}: HTTP {e.code}')
              except Exception as e:
                  unverified += 1
                  print(f'::warning::could not verify {name}@{sha}: {e}')

          if bad:
              for p, i, ref, why in bad:
                  print(f'::error file={p},line={i}::{why}: {ref}')
              sys.exit(1)
          print(f'All {sum(len(v) for v in refs.values())} action references are '
                f'SHA-pinned; {checked} resolved, {unverified} unverified.')
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: workflow-hardening
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: workflow-hardening
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mypy types-PyYAML types-cachetools types-aiofiles
      - name: mypy (core + proxy + store)
        # store/ was outside the gate while holding the hand-written SQL and
        # both backend implementations. It passes clean, so it is in now.
        # plugins/ still reports 13 union-attr errors — genuine possible
        # AttributeErrors on a None rotator — and is left out until those are
        # fixed rather than silenced.
        run: python -m mypy core/ proxy/ store/ --ignore-missing-imports --disable-error-code misc --disable-error-code assignment --disable-error-code no-any-return

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: workflow-hardening
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r requirements.txt --skip-editable --ignore-vuln PYSEC-2024-62
        # BLOCKING: A security gateway must fail CI on known dependency CVEs.
        # Assessed non-risks are explicitly ignored via --ignore-vuln above.

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: workflow-hardening
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: the exposure this guards against was not an
          # accidental `git add .env` — it was real values typed into
          # .env.example, a file that is tracked on purpose and edited by hand
          # every time a variable is added. .gitignore cannot stop that.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # BLOCKING. Four live secrets were committed to this repository through
        # .env.example at 4b99f81 — the master key, the client key bag, the
        # identity secret and the federation secret — and history has not been
        # rewritten, so they are permanently public. Nothing prevented a repeat.

  supply-chain:
    name: Supply Chain Integrity
    runs-on: ubuntu-latest
    needs: workflow-hardening
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify dependency integrity + .pth scan
        run: python scripts/verify_deps.py --strict
      - name: Explicit .pth file audit
        run: |
          echo "Scanning for .pth files in site-packages..."
          PTH_FILES=$(find "$(python -c 'import site; print(site.getsitepackages()[0])')" -name "*.pth" 2>/dev/null || true)
          if [ -n "$PTH_FILES" ]; then
            echo "Found .pth files:"
            echo "$PTH_FILES"
            for f in $PTH_FILES; do
              if grep -qE "(exec\(|eval\(|subprocess|Popen|__import__|urllib|socket|base64|\.ssh|\.env|\.aws)" "$f" 2>/dev/null; then
                echo "CRITICAL: Suspicious .pth file detected: $f"
                echo "Contents:"
                cat "$f"
                exit 1
              fi
            done
            echo "All .pth files clean."
          else
            echo "No .pth files found (good)."
          fi
      - name: Check for blocked packages
        run: |
          for pkg in litellm openai-proxy llm-proxy; do
            if pip show "$pkg" 2>/dev/null; then
              echo "CRITICAL: Blocked package $pkg is installed!"
              exit 1
            fi
          done
          echo "No blocked packages found."

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    # The schema conformance suite needs a real Postgres. Without one it skips,
    # and skipping is how the two backends drifted unnoticed in the first place:
    # every Postgres test in the repo asserted against a MagicMock, so none of
    # its SQL had ever been parsed by a database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: llmproxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-benchmark httpx hypothesis
      - name: Run tests with coverage
        # The floor tracks the measurement rather than trailing it. It sat at
        # 68 against a measured 70.1, so roughly 220 statements of coverage
        # could drain away unnoticed — and the modules with room to fall are
        # the consequential ones. Raise it when it rises.
        # test_e2e.py and test_openapi_contracts.py used to be excluded here.
        # Both are hermetic (ASGITransport against an in-process app, no network)
        # and run in under a second each, so the exclusion only meant the gate
        # ran a smaller suite than the repository contains — and the OpenAPI
        # contract tests are the mechanism that keeps the published route
        # surface honest, so they are exactly the ones worth gating on.
        # integrated_test.py stays out: it skips without external services.
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=core --cov=proxy --cov=plugins --cov=store \
            --cov-report=term-missing \
            --cov-fail-under=71 \
            --ignore=tests/integrated_test.py \
            --ignore=tests/test_benchmarks.py
        env:
          PYTHONDONTWRITEBYTECODE: 1
          TEST_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/llmproxy_test
      - name: Benchmarks (non-gating)
        # Timing-sensitive, so a regression here should be visible without
        # failing a merge on a noisy runner. Previously this file ran nowhere:
        # it was excluded above AND pytest-benchmark was not installed, so the
        # suite was inert while its dependency kept being proposed for upgrade.
        continue-on-error: true
        run: python -m pytest tests/test_benchmarks.py -q --benchmark-min-rounds=3
        env:
          PYTHONDONTWRITEBYTECODE: 1

  invariants:
    name: Mathematical Invariants
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio hypothesis
      - name: Run invariant + determinism + concurrency tests
        run: |
          python -m pytest tests/test_invariants.py tests/test_determinism.py tests/test_concurrency_stress.py \
            -v --tb=long -x
        env:
          PYTHONDONTWRITEBYTECODE: 1

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    needs: workflow-hardening
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: |
          python -m compileall core/ proxy/ store/ plugins/ -q

  docker-size:
    name: Docker Image Size
    runs-on: ubuntu-latest
    needs: workflow-hardening
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build Docker image
        run: docker build -t llmproxy:ci .
      - name: Check image size
        run: |
          SIZE=$(docker image inspect llmproxy:ci --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "WARNING: Docker image exceeds 500MB (${SIZE_MB}MB)"
            exit 1
          fi

  # ── Publish, only behind everything above ─────────────────────────────────
  # The image is built and pushed by the reusable workflow in docker.yml, and
  # reaches it only when the gates have passed. `needs` is the whole mechanism:
  # a failure anywhere above means no image, and no moved `latest`.
  publish-image:
    name: Build & Push Image
    needs:
      - lint
      - typecheck
      - security
      - supply-chain
      - test
      - invariants
      - syntax-check
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker.yml

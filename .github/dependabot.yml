version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "opentelemetry-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - documentation

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    # vitest and its @vitest/* plugins pin each other to the same version
    # (@vitest/coverage-v8 4.1.9 peers vitest 4.1.9): bumped one at a time, as
    # in #229, every npm ci fails with ERESOLVE.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    # Tailwind 4 is a migration, not a bump: #238 arrived as a security update
    # for postcss-selector-parser and moved tailwindcss 3 -> 4 without naming
    # it, and the build failed on the new PostCSS plugin. The advisories it
    # would clear are in the dev build chain, outside the production audit
    # gate. Remove this ignore when the UI is migrated.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # Base images are digest-pinned in the Dockerfile, so patches arrive only
  # through this. Without it, pinning would trade a moving base for a frozen
  # one — the worse of the two.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - ci
    # CodeQL's init, autobuild, analyze and upload-sarif are one release and
    # must run at one version: #219 moved autobuild alone to 4.38.3 and both
    # Analyze jobs failed ("Loaded a configuration file for version 4.37.9,
    # but running version 4.38.3").
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"

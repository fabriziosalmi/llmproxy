groups:
  - name: llmproxy-alerts
    rules:
      # ── Availability ──
      - alert: LLMProxyDown
        expr: up{job="llmproxy"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLMProxy is down"
          description: "LLMProxy instance {{ $labels.instance }} is unreachable."

      - alert: HighErrorRate
        expr: >
          100 * rate(llm_proxy_request_errors_total[5m])
          / (rate(llm_proxy_requests_total[5m]) > 0) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Error rate above 5%"
          description: "LLMProxy error rate is {{ $value | printf \"%.1f\" }}% over 5m."

      # ── Latency ──
      - alert: HighP95Latency
        expr: >
          histogram_quantile(0.95, rate(llm_proxy_request_latency_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency above 5s"
          description: "P95 request latency is {{ $value | printf \"%.1f\" }}s."

      # ── Circuit Breakers ──
      - alert: CircuitBreakerOpen
        expr: llm_proxy_circuit_open > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker open for {{ $labels.endpoint }}"
          description: "Provider {{ $labels.endpoint }} has tripped its circuit breaker. Requests will use fallback chains."

      # ── Budget ──
      - alert: BudgetWarning
        expr: llm_proxy_budget_consumed_usd > 40
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Daily budget at ${{ $value | printf \"%.2f\" }}"
          description: "Approaching daily budget limit ($50). Consider reviewing model usage."

      - alert: BudgetExceeded
        expr: llm_proxy_budget_consumed_usd > 50
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Daily budget exceeded (${{ $value | printf \"%.2f\" }})"
          description: "Budget cap reached. Requests may be downgraded to local LLM or rejected."

      # ── Security ──
      - alert: InjectionSpike
        expr: increase(llm_proxy_injection_blocked_total[10m]) > 50
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Injection attack spike: {{ $value }} blocks in 10m"
          description: "Unusual volume of blocked injection attempts. Check threat ledger."

      - alert: AuthFailureSpike
        expr: increase(llm_proxy_auth_failures_total[5m]) > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Auth failure spike: {{ $value }} in 5m"
          description: "Possible brute-force attack or misconfigured client."

      # ── Background loops & persistence ──
      # Loops that iterate every few seconds to every five minutes.
      # The slow ones (hourly and daily) are excluded here and have their own
      # thresholds below; a 15-minute rule would fire for most of every hour on
      # a loop that is healthy and simply runs once an hour.
      - alert: BackgroundLoopStalled
        expr: >
          time() - llm_proxy_background_last_success_timestamp{loop!~"metrics_history|cache_eviction|audit_head|retention_purge"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Background loop {{ $labels.loop }} stalled >15m"
          description: "The loop has not completed an iteration. Check proxy logs; state writes/retention may be stuck."

      # Hourly loops (metrics_history, cache_eviction, audit_head by default):
      # stalled after two missed iterations. Raise this if you lengthen their
      # intervals (audit.head_log_interval_seconds, caching eviction).
      - alert: HourlyBackgroundLoopStalled
        expr: >
          time() - llm_proxy_background_last_success_timestamp{loop=~"metrics_history|cache_eviction|audit_head"} > 7500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hourly background loop {{ $labels.loop }} stalled >2h"
          description: "The loop has missed two iterations. For audit_head that also means the audit chain head is no longer being published."

      # The retention purge runs once a day.
      - alert: RetentionPurgeStalled
        expr: >
          time() - llm_proxy_background_last_success_timestamp{loop="retention_purge"} > 176400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retention purge has not completed in over 2 days"
          description: "Audit and spend rows older than gdpr.retention_days are not being deleted. Check proxy logs for 'Retention purge error'."

      - alert: AuditPersistenceFailing
        expr: increase(llm_proxy_audit_persistence_total{outcome="fail"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Audit writes are failing"
          description: "The tamper-evident chain has gaps. Check store health and disk immediately."

      - alert: LoadShedSpike
        expr: increase(llm_proxy_load_shed_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Admission control is shedding load"
          description: "Proxy at capacity (queues full). Scale or raise limits if sustained."

      - alert: MultipleInstances
        expr: llm_proxy_instance_count > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than one live instance sharing state"
          description: "Daily budget is enforced independently per instance — the fleet can overspend. Intended only for Redis-backed HA."

  - name: llmproxy-recording
    rules:
      # Pre-compute frequently queried metrics
      - record: llmproxy:request_rate_5m
        expr: rate(llm_proxy_requests_total[5m])

      - record: llmproxy:error_rate_5m
        expr: >
          rate(llm_proxy_request_errors_total[5m])
          / (rate(llm_proxy_requests_total[5m]) > 0)

      - record: llmproxy:p95_latency_5m
        expr: histogram_quantile(0.95, rate(llm_proxy_request_latency_seconds_bucket[5m]))

      - record: llmproxy:cost_per_hour
        expr: increase(llm_proxy_cost_total[1h])

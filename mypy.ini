[mypy]
python_version = 3.12
ignore_missing_imports = True
explicit_package_bases = True
warn_return_any = True
warn_unused_configs = True
no_implicit_optional = True
check_untyped_defs = True
# The single definition of what the blocking check ignores. CI and `make typecheck`
# both read it; `make typecheck` used to omit these on its own command line and
# report 23 errors on a main that CI passed. `assignment` stays off because the
# route-Protocol conformance check in proxy/routes/deps.py is deliberately written
# as a call, not an annotated assignment (see that file).
disable_error_code = misc, assignment, no-any-return
